<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzzle 3 - The Final Path</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Puzzle 3: The Final Path 🎯</h2>
        <div class="content">
            <p>You're almost there! One last challenge stands between you and your surprise.</p>
            <div class="riddle">
                What has keys but no locks, space but no room, and you can enter but can't go inside?
            </div>
            <div class="choices">
                <button class="choice-btn" onclick="checkChoice('piano')">🎹 A Piano</button>
                <button class="choice-btn" onclick="checkChoice('keyboard')">⌨️ A Keyboard</button>
                <button class="choice-btn" onclick="checkChoice('map')">🗺️ A Map</button>
                <button class="choice-btn" onclick="checkChoice('house')">🏠 A House</button>
            </div>
            <p id="message"></p>
        </div>
    </div>

    <script>
        function checkChoice(answer) {
            const message = document.getElementById('message');
            if (answer === 'keyboard') {
                message.className = 'success-message';
                message.textContent = '🎊 Perfect! You solved all the puzzles!';
                setTimeout(() => {
                    location.href = 'congrats.html';
                }, 2000);
            } else {
                message.className = 'error-message';
                message.textContent = 'Not quite! Think about something you use every day...';
            }
        }
    </script>
</body>
</html>
