<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge 3 - Salt Invaders!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .game-container {
            max-width: 800px;
            width: 100%;
        }

        .game-header {
            text-align: center;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
        }

        .game-header h2 {
            color: #00ff00;
            font-size: 32px;
            margin: 10px 0;
            text-shadow: 0 0 10px #00ff00;
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 20px;
        }

        #gameCanvas {
            border: 4px solid #00ff00;
            background: #111;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
        }

        .instructions {
            text-align: center;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            color: #00ff00;
        }

        .game-over {
            display: none;
            text-align: center;
            font-family: 'Courier New', monospace;
            margin-top: 20px;
        }

        .game-over.show {
            display: block;
        }

        .victory-text {
            color: #ffff00;
            font-size: 28px;
            text-shadow: 0 0 10px #ffff00;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <!-- DEV NAV - REMOVE BEFORE GIFTING -->
    <div style="background: #ff6b6b; color: white; padding: 10px; text-align: center; font-family: monospace; position: fixed; top: 0; left: 0; right: 0; z-index: 9999;">
        <strong>DEV MODE:</strong>
        <a href="index.html" style="color: white; margin: 0 10px;">Home</a> |
        <a href="puzzle1.html" style="color: white; margin: 0 10px;">P1</a> |
        <a href="puzzle2.html" style="color: white; margin: 0 10px;">P2</a> |
        <a href="puzzle3.html" style="color: white; margin: 0 10px;">P3</a> |
        <a href="puzzle4.html" style="color: white; margin: 0 10px;">P4</a> |
        <a href="puzzle5.html" style="color: white; margin: 0 10px;">P5</a> |
        <a href="congrats.html" style="color: white; margin: 0 10px;">End</a>
    </div>
    <div style="height: 50px;"></div>
    <div class="game-container">
        <div class="game-header">
            <h2>🧂 SALT INVADERS 🧂</h2>
            <div class="score-board">
                <div>SCORE: <span id="score">0</span></div>
                <div>SALTS LEFT: <span id="saltsLeft">20</span></div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="600"></canvas>

        <div class="instructions">
            ← → Arrow keys to move | SPACE to shoot
            <br>
            Destroy all the salt shakers!
        </div>

        <div class="game-over" id="gameOver">
            <div class="victory-text">🎉 YOU DEFEATED THE SALT ARMY! 🎉</div>
            <div style="color: #00ff00; font-size: 20px;">Moving to next challenge...</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game state
        let score = 0;
        let gameRunning = true;

        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 80,
            width: 50,
            height: 30,
            speed: 6
        };

        // Keys
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && gameRunning) {
                e.preventDefault();
                shoot();
            }
        });
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Bullets
        const bullets = [];
        function shoot() {
            bullets.push({
                x: player.x + player.width / 2 - 2,
                y: player.y,
                width: 4,
                height: 15,
                speed: 8
            });
        }

        // Salt invaders
        const salts = [];
        const rows = 4;
        const cols = 5;
        const saltSize = 40;
        const saltPadding = 60;
        const saltOffsetTop = 50;
        const saltOffsetLeft = 100;

        for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
                salts.push({
                    x: saltOffsetLeft + col * (saltSize + saltPadding),
                    y: saltOffsetTop + row * (saltSize + saltPadding),
                    width: saltSize,
                    height: saltSize,
                    alive: true,
                    moveRight: true
                });
            }
        }

        let saltDirection = 1;
        let saltSpeed = 1;
        let moveDownTimer = 0;

        // Draw functions
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x + player.width / 2, player.y + player.height / 2);

            // Draw a simple spaceship
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.moveTo(0, -15);
            ctx.lineTo(-20, 15);
            ctx.lineTo(20, 15);
            ctx.closePath();
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function drawBullets() {
            ctx.fillStyle = '#ffff00';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
        }

        function drawSalts() {
            salts.forEach(salt => {
                if (salt.alive) {
                    ctx.save();
                    ctx.font = `${saltSize}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('🧂', salt.x + salt.width / 2, salt.y + salt.height / 2);
                    ctx.restore();
                }
            });
        }

        function drawExplosion(x, y) {
            ctx.save();
            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💥', x, y);
            ctx.restore();
        }

        // Update functions
        function updatePlayer() {
            if (keys['ArrowLeft'] && player.x > 0) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] && player.x < canvas.width - player.width) {
                player.x += player.speed;
            }
        }

        function updateBullets() {
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;

                // Remove bullets that go off screen
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }
        }

        function updateSalts() {
            let hitEdge = false;

            salts.forEach(salt => {
                if (!salt.alive) return;

                salt.x += saltSpeed * saltDirection;

                // Check if any salt hit the edge
                if (salt.x <= 0 || salt.x >= canvas.width - salt.width) {
                    hitEdge = true;
                }
            });

            // Move down and reverse direction if hit edge
            if (hitEdge) {
                saltDirection *= -1;
                salts.forEach(salt => {
                    if (salt.alive) {
                        salt.y += 30;
                    }
                });
            }
        }

        function checkCollisions() {
            bullets.forEach((bullet, bulletIndex) => {
                salts.forEach((salt, saltIndex) => {
                    if (salt.alive &&
                        bullet.x < salt.x + salt.width &&
                        bullet.x + bullet.width > salt.x &&
                        bullet.y < salt.y + salt.height &&
                        bullet.y + bullet.height > salt.y) {

                        // Hit!
                        salt.alive = false;
                        bullets.splice(bulletIndex, 1);
                        score += 10;
                        document.getElementById('score').textContent = score;

                        // Update salts left
                        const saltsLeft = salts.filter(s => s.alive).length;
                        document.getElementById('saltsLeft').textContent = saltsLeft;

                        // Draw explosion effect
                        drawExplosion(salt.x + salt.width / 2, salt.y + salt.height / 2);

                        // Check win condition
                        if (saltsLeft === 0) {
                            gameRunning = false;
                            document.getElementById('gameOver').classList.add('show');
                            setTimeout(() => {
                                location.href = 'puzzle4.html';
                            }, 3000);
                        }
                    }
                });
            });
        }

        // Game loop
        function gameLoop() {
            if (!gameRunning) return;

            // Clear canvas
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update
            updatePlayer();
            updateBullets();
            updateSalts();
            checkCollisions();

            // Draw
            drawSalts();
            drawBullets();
            drawPlayer();

            requestAnimationFrame(gameLoop);
        }

        // Start game
        gameLoop();
    </script>
</body>
</html>
